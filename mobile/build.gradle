apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def nativeAbis = (findProperty('nativeAbis') ?: 'arm64-v8a,armeabi-v7a,x86,x86_64').split(',').toList()
def rustSource = rootProject.file(findProperty('rustSource') ?: 'aw-server-rust')
def webuiDist = rootProject.file(findProperty('webuiDist') ?: 'aw-server-rust/aw-webui/dist')
def nativeOutput = layout.buildDirectory.dir('generated/jniLibs')

android {
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "net.activitywatch.android"
        minSdkVersion 26
        targetSdkVersion 36

        // Local candidate version only; no tag or release workflow is configured.
        versionName '0.14.0b1'

        // Preserved local candidate value; no store version lookup is configured.
        versionCode 39

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // NOTE: This only works for API level 28 and above
        //testInstrumentationRunnerArguments useTestStorageService: 'true'

        // WARNING: Never commit this uncommented! (leads to huge APKs)
        //packagingOptions {
        //    doNotStrip '**/*.so'
        //}
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
                abiFilters.addAll(nativeAbis)
            }
        }
        debug {
            applicationIdSuffix ".debug"
            jniDebuggable true
            renderscriptDebuggable true
            ndk { abiFilters.addAll(project.hasProperty('nativeAbis') ? nativeAbis : ['arm64-v8a', 'x86_64']) }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    namespace 'net.activitywatch.android'
    sourceSets.main.jniLibs.srcDirs = [nativeOutput]
    // Never got this to work...
    if (project.hasProperty("doNotStrip")) {
        println "Configuring doNotStrip for jniLibs"
        packaging {
            jniLibs {
                keepDebugSymbols += "**/*.so"
            }
        }
    }

    // Creates a resource versionName with the full version
    // https://stackoverflow.com/a/36468650/965332
    applicationVariants.all { variant ->
        variant.resValue "string", "versionName", 'v' + variant.versionName
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.webkit:webkit:1.17.1'

    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.9'

    testImplementation "junit:junit:4.13.2"
    testImplementation 'org.json:json:20231013'
    androidTestImplementation "androidx.test.ext:junit-ktx:$extJUnitVersion"
    androidTestImplementation "androidx.test:runner:$androidXTestVersion"
    androidTestImplementation "androidx.test:rules:$androidXTestVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoVersion"
    androidTestUtil "androidx.test.services:test-services:$servicesVersion"
    androidTestImplementation "androidx.test.espresso:espresso-web:$espressoVersion"
    androidTestImplementation "androidx.browser:browser:1.8.0"
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation('org.awaitility:awaitility:4.3.0') {
        exclude group: 'org.hamcrest', module: 'hamcrest'
    }

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

// Cargo owns incremental compilation; every APK/AAB merge first verifies its JNI library.
def buildRust = tasks.register('buildRust', Exec) {
    environment 'ANDROID_NDK_HOME', new File(android.sdkDirectory, "ndk/${android.ndkVersion}")
    environment 'AW_WEBUI_DIR', webuiDist.absolutePath
    environment 'CARGO_TARGET_DIR', layout.buildDirectory.dir('rust').get().asFile.absolutePath
    commandLine(['bash', rootProject.file('scripts/build-native.sh').absolutePath,
                 rustSource.absolutePath, nativeOutput.get().asFile.absolutePath] + nativeAbis)
}
tasks.configureEach {
    if (name ==~ /merge.*JniLibFolders/) dependsOn(buildRust)
}
