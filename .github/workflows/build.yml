name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: '28.2.13676358'
  CARGO_BUILD_JOBS: '2'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check metadata source prerequisite
        run: python3 -m unittest discover -s scripts/tests -p 'test_metadata.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - name: Install native toolchains
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build embedded WebUI
        working-directory: aw-server-rust/aw-webui
        run: |
          npm ci
          VUE_APP_ON_ANDROID=true COMMIT_HASH="\"$(git rev-parse --short HEAD)\"" make build-vite
      - name: Check native library validator
        run: python3 -m unittest discover -s scripts/tests -p 'test_jnilibs.py' -v
      - name: Build encrypted JNI, run JVM tests and assemble local debug APK
        run: ./gradlew :mobile:testDebugUnitTest :mobile:assembleDebug -PnativeAbis=arm64-v8a,x86_64 --no-daemon --max-workers=2
      - name: Verify packaged native libraries
        run: python3 scripts/check-jnilibs.py --directory mobile/build/generated/jniLibs arm64-v8a x86_64
